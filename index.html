<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI CALCULATOR</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        This is your BMI calculator
    </nav>

    <div class="weightguide"><h2>BMI Weight Guide:
        </h2>
        <ol>
        <li>
            <b>Under weight</b> = Less than 18.6 
        </li>
    <li>
        <b>Normal Range</b> = Between 18.6 and 24.9
    </li>
    <li>
        <b>Overweight</b> = Greater than 24.9
    </li>
   </div>

   <div class="container">
    <h2><b>BMI CALCULATOR</b></h2>
    <form id="bmiform">
        <p><label>Height in CM : </label><input type="text" id="height"/>
        </p>
        <p><label>Weight in CM : </label><input type="text" id="weight"/></p>
        <button type="submit">Calculate</button>
        <div id="result"></div>
     </form>
   </div>
 <script src="script.js"></script>   
</body>
</html>
